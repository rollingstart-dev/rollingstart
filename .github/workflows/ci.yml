name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # gofmt -l lists the files that need formatting and exits 0 for a
      # clean or a dirty tree — non-zero only when it cannot parse or read
      # a file. A non-empty listing is the failure, and the message.
      - name: gofmt
        run: |
          files=$(gofmt -l .) || exit $?
          if [ -n "$files" ]; then
            echo "files need gofmt:"
            echo "$files"
            exit 1
          fi
      - run: go test ./...

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go mod tidy -diff
