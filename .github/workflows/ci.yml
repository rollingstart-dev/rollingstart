name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # gofmt -l lists the files that need formatting and exits 0 for a
      # clean or a dirty tree — non-zero only when it cannot parse or read
      # a file. A non-empty listing is the failure, and the message.
      - name: gofmt
        run: |
          files=$(gofmt -l .) || exit $?
          if [ -n "$files" ]; then
            echo "files need gofmt:"
            echo "$files"
            exit 1
          fi
      - run: go test ./...

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go mod tidy -diff

  # The gopls modernize analyzer, not Go 1.26's built-in `go fix -diff`:
  # the built-in fixers lack errorsastype, which was three of the four
  # findings the first audit turned up. A finding fails the run by exit
  # status. Pinned so a new gopls release cannot turn main red on its
  # own. `go-version: stable` still floats, so a red run showing a
  # build or type-check error rather than a finding means Go moved
  # under the pinned analyzer: bump the pin. review.yml's allowlist
  # carries the same pin and must move with it.
  modernize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@v0.23.0 -test ./...
